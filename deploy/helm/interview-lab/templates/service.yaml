# Service provides stable in-cluster networking for matching application pods.
apiVersion: v1
kind: Service
metadata:
  # Service name and common chart labels.
  name: {{ include "interview-lab.fullname" . }}
  labels: {{- include "interview-lab.labels" . | nindent 4 }}
spec:
  # Service exposure type (ClusterIP by default).
  type: {{ .Values.service.type }}
  # Select only pods from this release and application name.
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ include "interview-lab.name" . }}
  # Map the stable service port to the container's named HTTP port.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
