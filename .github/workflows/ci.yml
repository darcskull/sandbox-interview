name: Interview Lab CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-tests:
    name: Java 27 build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Java 27 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Build, test, and check formatting
        run: mvn --batch-mode clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker-build-and-smoke-check:
    name: Build and verify the Docker image
    runs-on: ubuntu-latest
    needs: java-tests
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Build the application image
        run: docker build --tag interview-lab:${{ github.sha }} .
      - name: Start the app for a health check
        run: |
          docker run --detach --name interview-lab-smoke \
            --publish 8080:8080 \
            --env SPRING_KAFKA_LISTENER_AUTO_STARTUP=false \
            --env SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP=false \
            interview-lab:${{ github.sha }}
      - name: Verify the liveness endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health/liveness; then
              exit 0
            fi
            sleep 2
          done
          docker logs interview-lab-smoke
          exit 1
      - name: Remove the smoke-test container
        if: always()
        run: docker rm --force interview-lab-smoke || true
